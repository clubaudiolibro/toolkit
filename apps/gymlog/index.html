<!DOCTYPE html>
<html lang="it" data-cat="benessere">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>GymLog</title>
  <meta name="description" content="Registro degli allenamenti in palestra: esercizi, gruppi, allenamenti, diario e timer.">
  <meta name="theme-color" content="#f7f7f5">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="GymLog">
  <meta name="referrer" content="no-referrer">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script src="../../assets/js/toolbox-guard.js"></script>
  <script src="../../assets/js/toolkit-theme.js"></script>
  <link rel="stylesheet" href="../../assets/css/toolkit.css">
  <link rel="stylesheet" href="../../assets/css/app-nav.css">
  <link rel="stylesheet" href="styles.css">
  <script src="../../assets/js/toolbox-config.js" defer></script>
  <script src="../../assets/js/toolbox-auth.js" defer></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <div class="top-left" id="top-left"></div>
      <h1 class="top-title" id="top-title">GymLog</h1>
      <div class="top-right">
        <div class="top-actions" id="top-right"></div>
        <button type="button" class="tk-theme-btn" data-size="sm" data-tk-theme></button>
      </div>
    </div>
    <nav class="tabs tabs-desktop" id="tabs-desktop" aria-label="Sezioni"></nav>
  </header>

  <div class="offline-banner" id="offline-banner" hidden>
    Sei senza connessione: le modifiche non verranno salvate. Attiva la rete dati.
  </div>

  <main class="view" id="view" tabindex="-1">
    <p class="loading">Caricamento…</p>
  </main>

  <nav class="tabs tabs-bottom" id="tabs-bottom" aria-label="Sezioni"></nav>

  <div class="toast" id="toast" aria-live="polite"></div>
</body>
</html>
